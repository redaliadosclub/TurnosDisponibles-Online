services:
  app:
    image: node:22-slim
    working_dir: /app
    env_file:
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - DISABLE_HMR=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx tsx server.ts"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
